# THMD-Guru LAB — VM3 AI-RAG Server 192.168.80.30: Vector DB + local LLM
# FastAPI chạy trực tiếp trên host (systemd: thmd-lab-airag.service) để dễ sửa code trong nghiên cứu.
name: thmd-lab-airag

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: lab-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    mem_limit: 512m

  ollama:
    image: ollama/ollama:latest
    container_name: lab-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"
    volumes:
      - ollama-models:/root/.ollama
    mem_limit: 3g

volumes:
  qdrant-data:
  ollama-models:

