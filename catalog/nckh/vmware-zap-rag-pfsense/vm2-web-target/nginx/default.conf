# THMD-Guru LAB — VM2 Nginx: trang danh mục mục tiêu + reverse proxy + log bằng chứng quét
log_format lab_trace '$remote_addr [$time_iso8601] "$request" $status $body_bytes_sent '
                     'rt=$request_time ua="$http_user_agent" host=$host upstream=$upstream_addr';

server {
    listen 80 default_server;
    server_name target.thmd.lab 192.168.80.20 _;

    access_log /var/log/nginx/lab_access.log lab_trace;
    error_log  /var/log/nginx/lab_error.log warn;

    # Lab chỉ phục vụ mạng 192.168.80.0/24
    allow 192.168.80.0/24;
    allow 127.0.0.1;
    deny all;

    root /usr/share/nginx/html;
    index index.html;

    location = / { try_files /index.html =404; }

    location /dvwa/ {
        proxy_pass http://dvwa:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect / /dvwa/;
    }

    location /WebGoat {
        proxy_pass http://webgoat:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

