# THMD-Guru Linux 1.0 (Genesis) — Unified GRUB2 Configuration (BIOS & UEFI)
# Owner: chief-os-architect

set default=0
set timeout=10

insmod all_video
insmod gfxterm
insmod png
terminal_output gfxterm

set menu_color_normal=white/blue
set menu_color_highlight=yellow/black

menuentry "THMD-Guru Linux 1.0 (Genesis) — Live System" {
    linux /live/vmlinuz boot=live components quiet splash
    initrd /live/initrd.img
}

menuentry "THMD-Guru Linux 1.0 (Genesis) — Install Operating System" {
    linux /live/vmlinuz boot=live components quiet splash install
    initrd /live/initrd.img
}

menuentry "THMD-Guru Linux 1.0 (Genesis) — Safe Mode (Load to RAM / No GPU ModeSet)" {
    linux /live/vmlinuz boot=live components toram nomodeset nosplash
    initrd /live/initrd.img
}

menuentry "THMD-Guru Linux 1.0 (Genesis) — Forensic & Incident Response Mode (No Disk Automount / No Swap)" {
    linux /live/vmlinuz boot=live components noautomount noswap nopersistence quiet
    initrd /live/initrd.img
}
