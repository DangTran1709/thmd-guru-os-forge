# THMD-Guru Linux Server — Enterprise Cloud & High-Throughput Profile
# Owner: chief-os-architect

# High-throughput TCP BBR & Fair Queueing
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.core.somaxconn = 32768
net.core.netdev_max_backlog = 16384
net.ipv4.tcp_max_syn_backlog = 16384
net.ipv4.ip_local_port_range = 10240 65535
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_probes = 5
net.ipv4.tcp_keepalive_intvl = 15

# Enterprise VM & File Descriptor scale
fs.file-max = 4194304
vm.swappiness = 10
vm.dirty_ratio = 15
vm.dirty_background_ratio = 5
vm.overcommit_memory = 1
vm.max_map_count = 262144

# Enable IP forwarding for container runtimes (Podman/Docker/K8s)
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
