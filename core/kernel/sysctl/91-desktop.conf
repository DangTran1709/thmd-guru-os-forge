# THMD-Guru Linux Desktop — Low-Latency & Developer Workstation Profile
# Owner: chief-os-architect

# Responsive desktop memory management (optimized for zram)
vm.swappiness = 100
vm.vfs_cache_pressure = 50
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10

# High inotify watches for IDEs (VS Code, JetBrains, Node/Rust/Go watchers)
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 1024
fs.file-max = 2097152

# Fast network responsiveness
net.core.default_qdisc = fq_codel
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
