# THMD-Guru Linux Server — edition descriptor (sourced by the builder, bash syntax)
# Owner: server-infra-lead
# shellcheck shell=bash disable=SC2034

EDITION="server"
ISO_NAME="thmd-guru-server-1.0-genesis-amd64"

# Extra `lb config` flags appended after the core flags.
#  - Headless: serial + VGA console, no splash.
#  - Debian Installer in "live" mode: d-i copies the customised live
#    squashfs to disk, so everything in includes.chroot/hooks reaches the
#    installed system. The preseed lives on the ISO (includes.binary) and is
#    mounted by d-i at /cdrom.
LB_ARGS=(
  --debian-installer live
  --debian-installer-distribution bookworm
  --debian-installer-gui false
  --archive-areas "main contrib non-free-firmware"
  --bootappend-live "boot=live components hostname=guru-server username=guru console=tty0 console=ttyS0,115200n8"
  --bootappend-install "auto=true priority=critical file=/cdrom/preseed/thmd-guru-server.cfg console=tty0 console=ttyS0,115200n8"
  --memtest none
  --iso-application "THMD-Guru Linux Server"
  --iso-publisher "THMD-Guru Global Tech Academy"
  --iso-volume "THMD-GURU-SRV-1.0"
)
