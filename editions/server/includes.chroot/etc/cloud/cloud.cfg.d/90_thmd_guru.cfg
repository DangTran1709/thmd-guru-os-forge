# THMD-Guru Linux Server — Cloud-Init Default Profile
# Owner: server-infra-lead

users:
  - default

disable_root: true
ssh_pwauth: false

system_info:
  distro: debian
  default_user:
    name: guru
    lock_passwd: true
    gecos: THMD-Guru Server Operator
    groups: [adm, sudo, systemd-journal]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/zsh
  package_mirrors:
    - arches: [default]
      failsafe:
        primary: http://deb.debian.org/debian
        security: http://security.debian.org/debian-security
