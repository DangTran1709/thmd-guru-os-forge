# THMD-Guru Global Tech Academy — Lab 02: Local AI, LLM & Vector DB Stack
version: "3.9"
services:
  ollama:
    image: ollama/ollama:latest
    container_name: guru-lab-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
  qdrant:
    image: qdrant/qdrant:latest
    container_name: guru-lab-qdrant
    ports:
      - "6333:6333"
volumes:
  ollama_data:
